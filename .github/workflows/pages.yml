name: Deploy docs

# Builds the Material for MkDocs site in docs/ and publishes it to GitHub Pages.
# docs/ 의 Material for MkDocs 사이트를 빌드해 GitHub Pages 에 배포합니다.
#
# Repository setting required once: Settings → Pages → Source = GitHub Actions.
# 저장소에서 한 번만 설정하면 됩니다: Settings → Pages → Source = GitHub Actions.

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run supersedes an older one, but an in-progress deploy finishes rather than
# leaving the site half-published.
# 대기 중인 실행은 이전 실행을 대체하되, 진행 중인 배포는 사이트가 중간 상태로 남지 않도록
# 완료를 허용합니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-revision-date plugins and the edit links need real history.
          # 리비전 날짜 플러그인과 편집 링크에는 실제 이력이 필요합니다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install / 설치
        run: pip install -r requirements-docs.txt

      # --strict turns broken internal links and bad config into build failures, so a
      # dead link fails CI instead of shipping.
      # --strict 는 깨진 내부 링크와 잘못된 설정을 빌드 실패로 처리하므로, 죽은 링크가
      # 배포되는 대신 CI 에서 걸립니다.
      - name: Build / 빌드
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Renders the site in headless Chromium and asserts against the live DOM. The static
  # HTML cannot show whether mermaid draws, the copy buttons appear, the Korean font
  # resolves or dark mode works — all of that is client-side.
  # 헤드리스 Chromium 으로 사이트를 렌더링해 실제 DOM 에 대해 검사합니다. mermaid 렌더링,
  # 복사 버튼, 한글 폰트 적용, 다크 모드 동작은 정적 HTML 로 확인할 수 없습니다. 모두
  # 클라이언트 사이드입니다.
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium

      - name: Serve and check / 서빙 후 검사
        run: |
          mkdir -p shots
          python3 -m http.server 8099 --directory site &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done
          DOCS_URL=http://127.0.0.1:8099 SHOT_DIR=shots node tools/verify-docs.js
        env:
          SHOT_DIR: shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-screenshots
          path: shots/
          if-no-files-found: warn

  deploy:
    # Pull requests get the build and browser checks but must not publish.
    # PR 은 빌드·브라우저 검사만 받고 배포하지 않습니다.
    if: github.event_name != 'pull_request'
    needs: [build, browser-check]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
