# GitHub Pages configuration / GitHub Pages 설정
#
# Uses the remote-theme "just-the-docs", which gives a sidebar, search and a
# light/dark toggle without vendoring a theme into this repository.
# 테마를 리포지토리에 포함하지 않고 사이드바·검색·라이트/다크 전환을 제공하는
# remote-theme "just-the-docs" 를 사용합니다.

title: tpcds-scripts
description: >-
  TPC-DS derived schemas, queries and runner scripts for Oracle, PostgreSQL,
  Vertica, ClickHouse and StarRocks.
  Oracle, PostgreSQL, Vertica, ClickHouse, StarRocks 를 위한 TPC-DS 파생
  스키마·쿼리·실행 스크립트.

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Set by the Pages workflow; harmless locally.
# Pages 워크플로가 설정하며 로컬에서는 영향이 없습니다.
baseurl: ""

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/litkhai/tpcds-scripts"
aux_links_new_tab: true

nav_external_links:
  - title: "TPC-DS (tpc.org)"
    url: "https://www.tpc.org/tpcds/"

footer_content: >-
  Apache-2.0 for this project's own scripts. TPC-DS is a trademark of the TPC;
  results measured here are not TPC-DS results.
  이 프로젝트 고유 스크립트는 Apache-2.0. TPC-DS 는 TPC 의 상표이며 여기서 측정한
  값은 TPC-DS 결과가 아닙니다.

exclude:
  - Gemfile
  - Gemfile.lock
