name: Deploy GitHub Pages

# Publishes docs/ as the project site. Runs on pushes to the default branch that
# touch the docs, and can be triggered by hand.
# docs/ 를 프로젝트 사이트로 배포합니다. 기본 브랜치에서 문서가 변경된 push 와
# 수동 실행에 반응합니다.

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run supersedes an older one, but an in-progress deploy is allowed to
# finish rather than leaving the site half-published.
# 대기 중인 실행은 이전 실행을 대체하되, 진행 중인 배포는 사이트가 중간 상태로
# 남지 않도록 완료를 허용합니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
